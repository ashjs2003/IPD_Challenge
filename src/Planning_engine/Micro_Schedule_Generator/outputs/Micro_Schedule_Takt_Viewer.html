<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Micro Schedule Takt Viewer</title>
  <style>
    :root {
      --label-width: 260px;
      --hour-width: 18px;
      --row-height: 34px;
      --border: #d7dce3;
      --text: #111827;
      --muted: #64748b;
      --panel: #f8fafc;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, Segoe UI, Arial, sans-serif;
      color: var(--text);
      background: #ffffff;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 18px;
      min-height: 56px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.96);
    }
    h1 {
      margin: 0;
      font-size: 17px;
      font-weight: 650;
      white-space: nowrap;
    }
    .meta {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }
    .legend {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-left: auto;
      min-width: 0;
    }
    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: #334155;
      white-space: nowrap;
    }
    .swatch {
      width: 12px;
      height: 12px;
      border-radius: 2px;
      border: 1px solid rgba(15, 23, 42, 0.18);
    }
    .viewport {
      height: calc(100vh - 56px);
      overflow: auto;
      background:
        linear-gradient(to right, #fff 0, #fff var(--label-width), transparent var(--label-width)),
        #fff;
    }
    .canvas {
      position: relative;
      width: 71738px;
      height: 2194px;
      min-width: 100%;
    }
    .corner {
      position: sticky;
      left: 0;
      top: 0;
      z-index: 15;
      width: var(--label-width);
      height: 52px;
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      padding: 18px 12px;
      font-size: 12px;
      font-weight: 650;
      color: #334155;
    }
    .time-axis {
      position: sticky;
      top: 0;
      left: var(--label-width);
      z-index: 10;
      height: 52px;
      width: 71478px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }
    .tick {
      position: absolute;
      top: 0;
      width: 1px;
      height: 2194px;
      background: #edf1f5;
    }
    .tick.major {
      background: #cbd5e1;
    }
    .tick-label {
      position: absolute;
      top: 8px;
      transform: translateX(4px);
      font-size: 11px;
      color: #475569;
      white-space: nowrap;
    }
    .lane-label {
      position: sticky;
      left: 0;
      z-index: 8;
      height: var(--row-height);
      width: var(--label-width);
      border-right: 1px solid var(--border);
      border-bottom: 1px solid #eef2f7;
      background: #fff;
      padding: 9px 12px;
      font-size: 12px;
      color: #1f2937;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .lane-line {
      position: absolute;
      left: var(--label-width);
      width: 71478px;
      height: 1px;
      background: #eef2f7;
    }
    .bar {
      position: absolute;
      height: 20px;
      border-radius: 4px;
      border: 1px solid rgba(15, 23, 42, 0.18);
      color: #fff;
      font-size: 10px;
      line-height: 18px;
      padding: 0 6px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: default;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.16);
    }
    .bar:hover {
      filter: brightness(0.92);
      z-index: 12;
    }
    .tooltip {
      position: fixed;
      z-index: 40;
      display: none;
      max-width: 360px;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: #fff;
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.18);
      font-size: 12px;
      line-height: 1.45;
      pointer-events: none;
    }
    .tooltip b {
      display: block;
      margin-bottom: 3px;
      font-size: 13px;
    }
  </style>
</head>

  <script>
    const data = JSON.parse(document.getElementById('schedule-data').textContent);
    const canvas = document.getElementById('canvas');
    const timeAxis = document.getElementById('timeAxis');
    const legend = document.getElementById('legend');
    const tooltip = document.getElementById('tooltip');
    const startDate = new Date(data.projectStart);
    const laneIndex = new Map(data.lanes.map((lane, index) => [lane, index]));

    document.getElementById('meta').textContent =
      `${data.lanes.length} lanes | ${data.bars.length} bars | ${data.totalHours} hours`;

    for (const wbs of data.wbsNames) {
      const item = document.createElement('div');
      item.className = 'legend-item';
      const swatch = document.createElement('span');
      swatch.className = 'swatch';
      swatch.style.background = data.colors[wbs] || data.colors.UNASSIGNED;
      item.appendChild(swatch);
      item.appendChild(document.createTextNode(wbs));
      legend.appendChild(item);
    }

    for (let hour = 0; hour <= data.totalHours; hour += 1) {
      const x = data.labelWidth + hour * data.hourWidth;
      const tick = document.createElement('div');
      tick.className = hour % 24 === 0 ? 'tick major' : 'tick';
      tick.style.left = `${x}px`;
      tick.style.top = '52px';
      canvas.appendChild(tick);

      if (hour % 24 === 0 || hour === data.totalHours) {
        const label = document.createElement('div');
        label.className = 'tick-label';
        label.style.left = `${hour * data.hourWidth}px`;
        const date = new Date(startDate.getTime() + hour * 3600000);
        label.textContent = `h${hour} | ${date.toLocaleDateString([], {month: 'short', day: 'numeric'})}`;
        timeAxis.appendChild(label);
      }
    }

    data.lanes.forEach((lane, index) => {
      const y = 52 + index * data.rowHeight;
      const label = document.createElement('div');
      label.className = 'lane-label';
      label.style.top = `${y}px`;
      label.style.position = 'absolute';
      label.textContent = lane;
      label.title = lane;
      canvas.appendChild(label);

      const line = document.createElement('div');
      line.className = 'lane-line';
      line.style.top = `${y + data.rowHeight}px`;
      canvas.appendChild(line);
    });

    function formatDateTime(value) {
      return new Date(value).toLocaleString([], {
        month: 'short',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    for (const bar of data.bars) {
      const lane = laneIndex.get(bar.lane);
      if (lane === undefined) continue;
      const el = document.createElement('div');
      el.className = 'bar';
      el.style.left = `${data.labelWidth + bar.startHour * data.hourWidth}px`;
      el.style.top = `${52 + lane * data.rowHeight + 7}px`;
      el.style.width = `${Math.max(bar.durationHour * data.hourWidth, 5)}px`;
      el.style.background = bar.color;
      el.textContent = bar.microTaskName;
      el.dataset.tooltip = `
        <b>${bar.microTaskName}</b>
        WBS: ${bar.wbs}<br>
        Lane: ${bar.lane}<br>
        Task: ${bar.taskId} ${bar.taskName}<br>
        Start: ${formatDateTime(bar.start)}<br>
        End: ${formatDateTime(bar.end)}<br>
        Duration: ${bar.durationHour.toFixed(2)} hr<br>
        Elements: ${bar.elements}
      `;
      el.addEventListener('mousemove', event => {
        tooltip.innerHTML = el.dataset.tooltip;
        tooltip.style.display = 'block';
        tooltip.style.left = `${Math.min(event.clientX + 14, window.innerWidth - 380)}px`;
        tooltip.style.top = `${Math.min(event.clientY + 14, window.innerHeight - 170)}px`;
      });
      el.addEventListener('mouseleave', () => {
        tooltip.style.display = 'none';
      });
      canvas.appendChild(el);
    }
  </script>
